name: Python Bindings

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-bindings.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-bindings.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Run unit tests
        run: python -m unittest discover -s python/tests -p "test_*.py"

      - name: Build native library
        if: matrix.python-version == '3.12'
        run: python python/scripts/build_native_lib.py

      - name: Smoke test native eval
        if: matrix.python-version == '3.12'
        run: python python/scripts/smoke_native_eval.py

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel python

      - name: Verify import from built wheel
        run: |
          python -m pip install --force-reinstall python/dist/*.whl
          python -c "import quickjs_emscripten as q; print('import ok', q.__version__)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-bindings-dist-py${{ matrix.python-version }}
          path: python/dist/*
