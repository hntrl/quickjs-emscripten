[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quickjs-emscripten-py"
version = "0.0.0"
description = "Python bindings for quickjs-emscripten (scaffold)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "quickjs-emscripten maintainers" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/justjake/quickjs-emscripten"
Issues = "https://github.com/justjake/quickjs-emscripten/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
